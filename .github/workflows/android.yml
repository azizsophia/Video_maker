name: Ketabi Android emulator test (temporary)
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        api: [35, 30]
    defaults:
      run:
        working-directory: src
    steps:
      - uses: actions/checkout@v4
      - name: Unlock
        working-directory: .
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash .github/unlock/unlock.sh android${{ matrix.api }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build the web app
        run: |
          npm ci --no-audit --no-fund --loglevel=error
          # Google Fonts sometimes answers next/font with an unusable file list; try again.
          for i in 1 2 3 4; do npm run build > build.log 2>&1 && break; tail -5 build.log; sleep 20; done; test -f out/index.html
          npx cap sync android > /dev/null
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://bxvyoemwegzenjaynhwi.supabase.co
          NEXT_PUBLIC_E2E: "1"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests and build the APKs
        working-directory: src/android
        run: ./gradlew --no-daemon -q :app:testDebugUnitTest :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Free disk space for the emulator
        working-directory: .
        run: sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /opt/hostedtoolcache/CodeQL /usr/local/.ghcup
      - name: Enable KVM
        working-directory: .
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run on the emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          disk-size: 3000M
          ram-size: 4096M
          heap-size: 576M
          emulator-options: -no-window -gpu swangle_indirect -noaudio -no-boot-anim -camera-back none
          working-directory: src
          script: bash .github/scripts/android-device-tests.sh
      - name: Keep screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-api${{ matrix.api }}-results
          path: |
            src/device-results/
            src/android/app/build/reports/tests/
          retention-days: 1
          if-no-files-found: ignore
