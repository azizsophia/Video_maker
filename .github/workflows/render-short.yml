name: Render Viral Short

# Fast-cut scroll-stopper (Kokoro narration + matched Pexels B-roll + big
# karaoke captions). Vertical 9:16. Trigger it from the GitHub mobile app.
on:
  workflow_dispatch:
    inputs:
      script:
        description: "Short script path"
        required: true
        default: "scripts/shorts/three-people-allah-loves.json"
      theme:
        description: "Theme: midnight | emerald | sand | noor"
        required: true
        default: "emerald"
      voice:
        description: "Kokoro voice (bm_george British male, am_michael, af_heart, bf_emma …)"
        required: true
        default: "bm_george"

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies (Chrome + espeak-ng)
        run: |
          sudo apt-get update
          sudo apt-get install -y espeak-ng libnss3 libdbus-1-3 libatk1.0-0 libgbm1 \
            libasound2t64 libatk-bridge2.0-0 libgtk-3-0 libxss1 || \
          sudo apt-get install -y espeak-ng libnss3 libdbus-1-3 libatk1.0-0 libgbm1 \
            libasound2 libatk-bridge2.0-0 libgtk-3-0 libxss1

      - name: Install Node dependencies
        run: npm ci

      - name: Install Kokoro (open-source TTS)
        run: pip install -r scripts/requirements-kokoro.txt

      - name: Build short (Kokoro narration + Pexels B-roll + ayahs)
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: |
          npx tsx scripts/build-short.ts \
            --script="${{ inputs.script }}" \
            --theme="${{ inputs.theme }}" \
            --voice="${{ inputs.voice }}" \
            --out=src/data/short-render.json

      - name: Render video
        run: |
          mkdir -p out
          npx remotion render ViralShort "out/short.mp4" \
            --props=src/data/short-render.json --concurrency=$(nproc) --crf 23

      - name: Upload video artifact
        uses: actions/upload-artifact@v4
        with:
          name: viral-short
          path: |
            out/short.mp4
            src/data/short-render.json
          retention-days: 14

      - name: Check Drive credentials
        id: drive
        env:
          URL: ${{ secrets.DRIVE_UPLOAD_URL }}
        run: |
          if [ -n "$URL" ]; then echo "method=webapp" >> "$GITHUB_OUTPUT"; else echo "method=none" >> "$GITHUB_OUTPUT"; fi

      - name: Upload to Google Drive
        if: ${{ steps.drive.outputs.method != 'none' }}
        env:
          DRIVE_UPLOAD_URL: ${{ secrets.DRIVE_UPLOAD_URL }}
          DRIVE_UPLOAD_TOKEN: ${{ secrets.DRIVE_UPLOAD_TOKEN }}
        run: |
          NAME="Ketabi — Short — $(basename "${{ inputs.script }}" .json).mp4"
          python3 scripts/upload_to_drive.py --file "out/short.mp4" --name "$NAME" --mime video/mp4 --replace
